
name: Publicar PWA y generar QR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar sitio web
        run: |
          test -f web/index.html
          mkdir -p _site
          cp -R web/. _site/

      - name: Instalar generador QR
        run: |
          python -m pip install "qrcode[pil]>=7,<9"

      - name: Generar QR de h.UBA
        run: |
          python - <<'PY'
          import os
          import qrcode

          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/")
          url = f"https://{owner.lower()}.github.io/{repo}/"
          qrcode.make(url).save("_site/qr.png")
          print("URL publicada:", url)
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
